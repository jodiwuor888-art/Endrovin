spring:
  # ============================================================
  # Azure SQL Database (SQL Server)
  # Uses the existing prod driver — no extra dependency needed
  # Encrypt=true is required by Azure SQL
  # ============================================================
  datasource:
    url: jdbc:sqlserver://${DB_HOST}:${DB_PORT:1433};databaseName=${DB_NAME:PortfolioDB};encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;connectRetryCount=3;connectRetryInterval=10
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      pool-name: AzureSQLPool
      maximum-pool-size: 5     # Azure SQL free tier: max 30 concurrent connections
      minimum-idle: 1
      idle-timeout: 300000     # 5 min
      connection-timeout: 30000
      max-lifetime: 1200000    # 20 min
      keepalive-time: 60000
      connection-test-query: SELECT 1

  # JPA / Hibernate for Azure SQL Server
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 10
        order_inserts: true
        order_updates: true
