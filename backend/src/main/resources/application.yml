spring:
  application:
    name: portfolio-management-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  # File Upload Multi-part limits
  servlet:
    multipart:
      enabled: true
      max-file-size: 15MB
      max-request-size: 20MB

  # Database Configuration (Microsoft SQL Server)
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:PortfolioDB};encrypt=true;trustServerCertificate=true;integratedSecurity=${DB_INTEGRATED_SECURITY:false}
    username: ${DB_USER:portfolio_admin}
    password: ${DB_PASSWORD:StrongPassword123!}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      pool-name: PortfolioHikariCP
      maximum-pool-size: 15
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 8000
      max-lifetime: 1800000
      keepalive-time: 60000
      connection-test-query: SELECT 1

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false
        cache:
          use_second_level_cache: false
          use_query_cache: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # Email Configuration (Optional SMTP for contact alerts)
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            trust: ${SMTP_HOST:smtp.gmail.com}
          connectiontimeout: 8000
          timeout: 8000
          writetimeout: 8000

# Server Configuration
server:
# ── Response Compression (GZIP) ─────────────────────────────────
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,text/javascript,application/javascript,image/svg+xml
    min-response-size: 1024

# ── Tomcat Thread Pool & Connection Tuning ───────────────────────
  tomcat:
    threads:
      max: 200
      min-spare: 20
    accept-count: 100
    connection-timeout: 10000
    max-connections: 8192
    keep-alive-timeout: 20000

# ── HTTP/2 Support ───────────────────────────────────────────────
  http2:
    enabled: true

  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

# Portfolio Custom Application Properties
portfolio:
  security:
    trust-proxy-headers: ${TRUST_PROXY_HEADERS:true}
    jwt:
      secret: ${JWT_SECRET:}
      expiration-ms: 86400000 # 24 hours
    rate-limit:
      max-attempts: 5
      lockout-duration-minutes: 15
    password-reset-url: ${PASSWORD_RESET_URL:https://endrovin-frontendport.vercel.app/admin/login.html}
    password-reset-from: ${PASSWORD_RESET_FROM:${SMTP_USERNAME:}}
    webauthn:
      rp-id: ${WEBAUTHN_RP_ID:localhost}
      rp-name: ${WEBAUTHN_RP_NAME:Portfolio Management System}
      # Comma-separated list of allowed WebAuthn origins; supports wildcard suffix (*) for subdomain matching.
      # Production: set WEBAUTHN_ALLOWED_ORIGINS on Render to include your Vercel URL.
      allowed-origins: ${WEBAUTHN_ALLOWED_ORIGINS:http://localhost:8080,https://localhost:8080,http://127.0.0.1:8080,http://localhost:5500,http://127.0.0.1:5500,https://*.vercel.app,https://*.onrender.com}
  upload:
    dir: ${UPLOAD_DIR:uploads}
    max-image-bytes: 5242880 # 5 MB
    max-document-bytes: 10485760 # 10 MB
    allowed-image-types:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif
    allowed-document-types:
      - application/pdf
  cors:
    allowed-origins: ${WEBAUTHN_ALLOWED_ORIGINS:*}
  contact:
    notification-email: ${NOTIFICATION_EMAIL:bevexj888@gmail.com}
    enable-email-notifications: ${ENABLE_EMAIL_NOTIFICATIONS:true}

# Actuator Configuration
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
