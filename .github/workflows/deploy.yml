name: Build & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  JAVA_DISTRO: 'temurin'

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Build Spring Boot Backend with Maven
  # ──────────────────────────────────────────────────────────────
  build-backend:
    name: Build Spring Boot Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}
          cache: maven

      - name: Build with Maven (skip tests)
        run: mvn package -DskipTests -B

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/portfolio-management-system-*.jar
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # Job 2: Validate Frontend HTML files
  # ──────────────────────────────────────────────────────────────
  validate-frontend:
    name: Validate Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate HTML files have closing tags
        run: |
          echo "Checking HTML files in frontendport/..."
          for f in $(find frontendport -name "*.html"); do
            if ! grep -q "</html>" "$f"; then
              echo "MISSING </html> in: $f"
              exit 1
            else
              echo "  OK: $f"
            fi
          done
          echo "All HTML files validated."

      - name: Check no .env files accidentally committed
        run: |
          if find . -name ".env" -not -path "./.git/*" | grep -q .; then
            echo "ERROR: A .env file was found in the repository!"
            exit 1
          fi
          echo "No .env files committed. Good."

  # ──────────────────────────────────────────────────────────────
  # Job 3: Build and verify Docker image
  # ──────────────────────────────────────────────────────────────
  docker-build-test:
    name: Verify Docker Build
    runs-on: ubuntu-latest
    needs: build-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f backend/Dockerfile \
            backend/ \
            --tag joash-portfolio:ci-test

      - name: Verify Docker image was created
        run: docker images joash-portfolio:ci-test

  # ──────────────────────────────────────────────────────────────
  # Job 4: Trigger Render backend deploy (main branch only)
  # ──────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: [ build-backend, validate-frontend, docker-build-test ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set - skipping Render deploy."
          else
            curl -s -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Render deploy triggered."
          fi

  # ──────────────────────────────────────────────────────────────
  # Job 5: Deploy Frontend to Vercel (main branch only)
  # ──────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: validate-frontend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret not set - skipping Vercel deploy."
          else
            npm install -g vercel --silent
            vercel --token "$VERCEL_TOKEN" --prod --yes
          fi
