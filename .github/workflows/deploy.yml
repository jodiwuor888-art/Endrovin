name: Build & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  JAVA_DISTRO: 'temurin'

jobs:

  # ──────────────────────────────────────────────────────────────
  # Job 1: Build Spring Boot Backend with Maven
  # ──────────────────────────────────────────────────────────────
  build-backend:
    name: Build Spring Boot Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build with Maven (skip tests)
        run: ./mvnw package -DskipTests -B

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/portfolio-management-system-*.jar
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # Job 2: Validate Frontend HTML files
  # ──────────────────────────────────────────────────────────────
  validate-frontend:
    name: Validate Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate HTML files have closing tags
        run: |
          echo "Checking HTML files in frontendport/..."
          FAIL=0
          while IFS= read -r -d '' f; do
            if ! grep -q "</html>" "$f"; then
              echo "MISSING </html> in: $f"
              FAIL=1
            else
              echo "  OK: $f"
            fi
          done < <(find frontendport -name "*.html" -print0)
          [ "$FAIL" -eq 0 ] && echo "All HTML files validated." || exit 1

      - name: Check no .env files accidentally committed
        run: |
          if find . -name ".env" -not -path "./.git/*" | grep -q .; then
            echo "ERROR: A .env file was found in the repository!"
            exit 1
          fi
          echo "No .env files committed. Good."

  # ──────────────────────────────────────────────────────────────
  # Job 3: Build and verify Docker image
  # ──────────────────────────────────────────────────────────────
  docker-build-test:
    name: Verify Docker Build
    runs-on: ubuntu-latest
    needs: build-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f backend/Dockerfile \
            backend/ \
            --tag joash-portfolio:ci-test

      - name: Verify Docker image was created
        run: docker image inspect joash-portfolio:ci-test --format "Image built successfully: {{.Id}}"

  # ──────────────────────────────────────────────────────────────
  # Job 4: Trigger Render backend deploy (main branch only)
  # ──────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: [ build-backend, validate-frontend ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set — skipping Render deploy."
            echo "Add it in: Settings > Secrets and variables > Actions"
          else
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
            echo "Render deploy hook response: HTTP $HTTP_CODE"
            [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "202" ] && echo "Deploy triggered successfully." || echo "Warning: unexpected HTTP code $HTTP_CODE"
          fi

  # ──────────────────────────────────────────────────────────────
  # Job 5: Deploy Frontend to Vercel (main branch only)
  # ──────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: validate-frontend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "VERCEL_TOKEN secret not set — skipping Vercel deploy."
            echo "Add it in: Settings > Secrets and variables > Actions"
          else
            npm install -g vercel --silent
            vercel --token "${{ secrets.VERCEL_TOKEN }}" --prod --yes
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
