# ============================================================
# render.yaml — Render Cloud Deployment Configuration
# Joash Portfolio Management System
# Database: Azure Database for MySQL OR Azure SQL Database
# Docs: https://render.com/docs/yaml-spec
# ============================================================

services:
  # ── Backend: Spring Boot Java Web Service ──────────────────
  - type: web
    name: joash-portfolio-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free

    healthCheckPath: /actuator/health
    autoDeploy: true

    envVars:
      # ── Spring Profile ──────────────────────────────────────
      # Use 'azure-mysql' for Azure Database for MySQL
      # Use 'azure-sql'   for Azure SQL Database (SQL Server)
      - key: SPRING_PROFILES_ACTIVE
        value: azure-mysql     # Change to azure-sql if using Azure SQL

      # ── Azure Database Credentials ──────────────────────────
      # Set all of these in Render Dashboard → Environment
      - key: DB_HOST
        sync: false   # e.g. joash-portfolio.mysql.database.azure.com
      - key: DB_PORT
        value: "3306" # 3306 for MySQL | 1433 for Azure SQL
      - key: DB_NAME
        value: PortfolioDB
      - key: DB_USER
        sync: false   # e.g. portfolioadmin   (NOT the full user@host format)
      - key: DB_PASSWORD
        sync: false

      # ── Security ────────────────────────────────────────────
      - key: JWT_SECRET
        sync: false   # 64-char hex: openssl rand -hex 32

      # ── WebAuthn — set AFTER you know your Vercel domain ────
      - key: WEBAUTHN_RP_ID
        sync: false   # e.g. joash-portfolio.vercel.app
      - key: WEBAUTHN_RP_NAME
        value: "Joash Portfolio"
      - key: WEBAUTHN_ALLOWED_ORIGINS
        sync: false   # e.g. https://joash-portfolio.vercel.app

      # ── File uploads ────────────────────────────────────────
      - key: UPLOAD_DIR
        value: /app/uploads

      # ── JPA DDL ─────────────────────────────────────────────
      - key: JPA_DDL_AUTO
        value: update

      # ── Optional email ──────────────────────────────────────
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: NOTIFICATION_EMAIL
        sync: false
      - key: ENABLE_EMAIL_NOTIFICATIONS
        value: "false"

    # Persistent disk for uploaded files (Uncomment if upgrading to Render Starter plan or higher)
    # disk:
    #   name: portfolio-uploads
    #   mountPath: /app/uploads
    #   sizeGB: 1
